server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location / { try_files $uri $uri/ /index.html; }
 location = /sw.js { add_header Cache-Control "no-cache"; }
 location = /index.html { add_header Cache-Control "no-cache"; }
}
