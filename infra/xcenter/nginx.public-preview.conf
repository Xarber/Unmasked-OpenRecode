server {
    listen 80;
    server_name unmasked.xcenter.it;
    return 301 https://unmasked.xcenter.it$request_uri;
}
server {
    listen 443 ssl;
    server_name unmasked.xcenter.it;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    access_log off;
    root /srv/xcenter/apps/unmasked/public-current;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location /api/ { default_type application/json; return 503 '{"message":"Accounts are unavailable in this preview."}'; }
    location /socket.io/ { return 503; }
    location ~ \.[a-zA-Z0-9]+$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
