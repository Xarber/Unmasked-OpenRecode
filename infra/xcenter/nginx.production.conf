server {
    listen 80;
    server_name unmasked.xcenter.it;
    return 301 https://unmasked.xcenter.it$request_uri;
}
server {
    listen 443 ssl;
    server_name unmasked.xcenter.it;
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;
    access_log off;
    client_max_body_size 32k;

    location /api/ {
        proxy_pass http://127.0.0.1:18551/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /socket.io/ {
        proxy_pass http://127.0.0.1:18551;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:18552;
        proxy_set_header Host $host;
    }
}
