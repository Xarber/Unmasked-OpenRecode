name: Bug report
description: Report unexpected behavior without including private messages or credentials.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
  - type: input
    id: version
    attributes:
      label: Version, platform and commit
