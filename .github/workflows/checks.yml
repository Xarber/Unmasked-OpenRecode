name: Checks
on:
  pull_request:
    branches: [testing, beta, main]
  workflow_dispatch:
concurrency:
  group: unmasked-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run uads:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:web
      - run: npm run uads:validate -- --web
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: unmasked-web-${{ github.sha }}
          path: apps/mobile/dist
